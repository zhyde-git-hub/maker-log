name: 构建并部署到 GitHub Pages（可选方案）

# 说明：
#   这是「自动部署」方案，适合后续内容更新频繁时使用。
#   如果你在仓库 Settings → Pages 里选的是
#   「Deploy from a branch」+ 分支 main + 目录 / (root)，
#   那么这个 workflow 可以不用（本仓库的构建产物已直接提交）。
#
#   若想改用 Actions 自动构建：
#   1. 去 Settings → Pages，把 Source 改成 "GitHub Actions"
#   2. 本文件里的 --out=dist 保持不变（Actions 会自己打包上传，不污染仓库）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建网站
        # base 取自仓库名，适配 GitHub Pages 的 /<仓库名>/ 子路径
        run: node src/build.js --base=/${{ github.event.repository.name }}/ --out=dist

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
