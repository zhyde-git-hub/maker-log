name: 构建并部署到 GitHub Pages

# 触发条件：推送到 main 分支时自动构建部署
# 也可以在 GitHub 网页的 Actions 页面手动点击运行
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建网站
        # 关键：传入 base 路径，因为 GitHub Pages 的网址是
        # https://<用户名>.github.io/<仓库名>/，站点根在子路径下
        run: node src/build.js --base=/${{ github.event.repository.name }}/ --out=dist

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
